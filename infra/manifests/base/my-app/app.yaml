---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: base-app
    app.kubernetes.io/part-of: my-app
    app.kubernetes.io/name: my-app
  name: my-app
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/component: base-app
    app.kubernetes.io/part-of: my-app
    app.kubernetes.io/name: my-app
  name: my-app-oauth-secrets
type: Opaque
data:
  cookie-secret: "WFhYWFhYWFhYWFhYWFhYWA=="
  client-secret: "WFhYWFhYWFg="
  client-id: "WFhYWFhYWA=="
---
# Source: oauth2-proxy/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: base-app
    app.kubernetes.io/part-of: my-app
    app.kubernetes.io/name: my-app
  name: my-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      appProtocol: http
      name: http
    - port: 44180
      protocol: TCP
      appProtocol: http
      targetPort: metrics
      name: metrics
  selector:    
    app.kubernetes.io/name: my-app
    app.kubernetes.io/component: base-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: base-app
    app.kubernetes.io/part-of: my-app
    app.kubernetes.io/name: my-app
    app: oauth2-proxy    
  name: my-app
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:      
      app.kubernetes.io/component: base-app
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/component: base-app
        app.kubernetes.io/name: my-app
        app.kubernetes.io/part-of: my-app
    spec:
      serviceAccountName: my-app
      enableServiceLinks: false # Disable service discovery using ENV variabels
      automountServiceAccountToken: false
      containers:
      - name: oauth2-proxy
        image: "quay.io/oauth2-proxy/oauth2-proxy:v7.9.0"
        imagePullPolicy: IfNotPresent
        args:
          - --http-address=0.0.0.0:4180
          - --https-address=0.0.0.0:4443
          - --metrics-address=0.0.0.0:44180
        env:
          - name: OAUTH2_PROXY_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: my-app-oauth-secrets 
                key: client-id
          - name: OAUTH2_PROXY_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: my-app-oauth-secrets 
                key: client-secret
          - name: OAUTH2_PROXY_COOKIE_SECRET
            valueFrom:
              secretKeyRef:
                name: my-app-oauth-secrets 
                key: cookie-secret
        ports:
          - containerPort: 4180
            name: http
            protocol: TCP
          - containerPort: 44180
            protocol: TCP
            name: metrics
        livenessProbe:
          httpGet:
            path: /ping
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /ready
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          timeoutSeconds: 5
          successThreshold: 1
          periodSeconds: 10
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 2000
          runAsNonRoot: true
          runAsUser: 2000
          seccompProfile:
            type: RuntimeDefault
