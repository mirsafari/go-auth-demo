---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: base-app
    app.kubernetes.io/part-of: my-app
    app.kubernetes.io/name: my-app
  name: my-app
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: base-app
    app.kubernetes.io/part-of: my-app
    app.kubernetes.io/name: my-app
  name: my-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      appProtocol: http
      name: http
    - port: 44180
      protocol: TCP
      appProtocol: http
      targetPort: metrics
      name: metrics
  selector:    
    app.kubernetes.io/name: my-app
    app.kubernetes.io/component: base-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: base-app
    app.kubernetes.io/part-of: my-app
    app.kubernetes.io/name: my-app
  name: my-app
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:      
      app.kubernetes.io/component: base-app
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/component: base-app
        app.kubernetes.io/name: my-app
        app.kubernetes.io/part-of: my-app
    spec:
      serviceAccountName: my-app
      enableServiceLinks: false # Disable service discovery using ENV variabels
      automountServiceAccountToken: false
      containers:
      - name: my-app
        image: my-app:v0.0.1
        imagePullPolicy: IfNotPresent

      - name: oauth2-proxy
        image: "quay.io/oauth2-proxy/oauth2-proxy:v7.9.0"
        imagePullPolicy: IfNotPresent
        args:
          - --http-address=0.0.0.0:4180
          - --https-address=0.0.0.0:4443
          - --metrics-address=0.0.0.0:44180
        ports:
          - containerPort: 4180
            name: http
            protocol: TCP
          - containerPort: 44180
            protocol: TCP
            name: metrics
        livenessProbe:
          httpGet:
            path: /ping
            port: http
            scheme: HTTP
          initialDelaySeconds: 60
          timeoutSeconds: 10
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /ready
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          timeoutSeconds: 5
          successThreshold: 1
          periodSeconds: 10
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 2000
          runAsNonRoot: true
          runAsUser: 2000
          seccompProfile:
            type: RuntimeDefault
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp-nip-io
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/client-header-buffer-size: 100k
    nginx.ingress.kubernetes.io/large-client-header-buffers: "4 100k"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    cert-manager.io/cluster-issuer: local-ca-selfsigned
spec:
  ingressClassName: nginx
  rules:
  - host: my-app.127.0.0.1.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: my-app
            port:
              name: http
  tls:
  - hosts:
      - my-app.127.0.0.1.nip.io
    secretName: myapp-https-certificate
